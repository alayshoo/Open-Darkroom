[package]
name = "open-darkroom"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "open_darkroom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25.9"
bytemuck = "1"
# Already behind image's TIFF support; taken directly so an export can carry
# the ICC tag, which image's TIFF encoder does not expose.
tiff = "0.10"
webp = "0.3"
half = "2"
rayon = "1.11"
fast_image_resize = "6.0"
wgpu = "25"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-store = "2.4.4"
lcms2 = { version = "6.2.0", features = ["static"] }
rawler = "0.8"

[dev-dependencies]
# Drives the async wgpu pipeline from synchronous #[test] functions.
pollster = "0.4"


[profile.dev]
opt-level = 2       # Enable deeper compilation. Improves backend image processing by 250x in dev mode
